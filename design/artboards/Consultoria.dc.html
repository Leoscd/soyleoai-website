<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #000000; }
    a { color: #FFDD00; text-decoration: none; }
    a:hover { color: #FFCC00; }

    .bp {
      --accent: #FFDD00;
      --ink: #f0f0f0;
      --dim: rgba(255,255,255,0.62);
      --faint: rgba(255,255,255,0.33);
      --rule: rgba(255,255,255,0.12);
      --exp: cubic-bezier(0.16, 1, 0.3, 1);
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      position: relative; background: #000000; color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif; line-height: 1.6;
      padding: 120px 0 116px; overflow: hidden;
    }
    .bp::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.09) 1px, transparent 0);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 80% 62% at 50% 52%, #000 6%, transparent 76%);
      -webkit-mask-image: radial-gradient(ellipse 80% 62% at 50% 52%, #000 6%, transparent 76%);
    }
    .wrap { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 0 48px; }

    .label { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin: 0 0 16px; }
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 58px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 16px; max-width: 18ch; }
    .lede { margin: 0 0 76px; color: var(--dim); font-size: 17px; max-width: 46ch; }

    /* Línea de proceso con guiones en movimiento */
    .proc { position: relative; height: 1px; margin-bottom: 0; background: var(--rule); }
    .proc::after {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 24px);
      background-size: 24px 1px;
      animation: flow 1.4s linear infinite;
      opacity: 0.55;
    }
    @keyframes flow { to { background-position: 24px 0; } }

    /* ── 3 fases sin caja, separadas por reglas ── */
    .fases {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      transition: grid-template-columns 0.75s var(--exp);
    }
    .cons--n0 .fases { grid-template-columns: 1.44fr 0.88fr 0.88fr; }
    .cons--n1 .fases { grid-template-columns: 0.88fr 1.44fr 0.88fr; }
    .cons--n2 .fases { grid-template-columns: 0.88fr 0.88fr 1.44fr; }

    .fase {
      position: relative; text-align: left;
      padding: 46px 48px 8px 0; background: none; border: 0;
      font-family: inherit; color: inherit; cursor: pointer; min-width: 0;
    }
    .fase + .fase { padding-left: 48px; }
    .fase + .fase::before { content: ''; position: absolute; left: 0; top: 0; bottom: 20px; width: 1px; background: var(--rule); }
    /* Marca de fase que baja desde la línea de proceso */
    .fase__cap { position: absolute; top: 0; left: 0; width: 2px; height: 0; background: var(--accent); transition: height 0.55s var(--exp); }
    .fase + .fase .fase__cap { left: 0; }
    .cons--n0 .fase[data-i="0"] .fase__cap,
    .cons--n1 .fase[data-i="1"] .fase__cap,
    .cons--n2 .fase[data-i="2"] .fase__cap { height: 30px; }

    .fase__n { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); margin-bottom: 30px; transition: color 0.4s var(--exp); }
    .fase__ico { display: block; color: var(--faint); margin-bottom: 26px; transition: color 0.45s var(--exp); }
    .fase__ico svg * { stroke-dasharray: 200; stroke-dashoffset: 200; transition: stroke-dashoffset 1.1s var(--exp); }
    .fase:hover .fase__ico { color: rgba(255,221,0,0.7); }
    .fase h3 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px;
      color: rgba(255,255,255,0.7); transition: color 0.4s var(--exp);
    }
    .fase__under { display: block; height: 1px; width: 100%; background: var(--rule); margin-bottom: 20px; position: relative; overflow: hidden; }
    .fase__under::after {
      content: ''; position: absolute; inset: 0; background: var(--accent);
      transform: scaleX(0); transform-origin: left center; transition: transform 0.6s var(--exp);
    }
    .fase p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.65; }

    .cons--n0 .fase[data-i="0"] .fase__n, .cons--n1 .fase[data-i="1"] .fase__n, .cons--n2 .fase[data-i="2"] .fase__n { color: var(--accent); }
    .cons--n0 .fase[data-i="0"] .fase__ico, .cons--n1 .fase[data-i="1"] .fase__ico, .cons--n2 .fase[data-i="2"] .fase__ico { color: var(--accent); }
    .cons--n0 .fase[data-i="0"] .fase__ico svg *, .cons--n1 .fase[data-i="1"] .fase__ico svg *, .cons--n2 .fase[data-i="2"] .fase__ico svg * { stroke-dashoffset: 0; }
    .cons--n0 .fase[data-i="0"] h3, .cons--n1 .fase[data-i="1"] h3, .cons--n2 .fase[data-i="2"] h3 { color: var(--ink); }
    .cons--n0 .fase[data-i="0"] .fase__under::after, .cons--n1 .fase[data-i="1"] .fase__under::after, .cons--n2 .fase[data-i="2"] .fase__under::after { transform: scaleX(1); }

    .foot { margin-top: 88px; padding-top: 46px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
    .cta {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 20px 48px; border-radius: 50px;
      background: var(--accent); border: 2px solid var(--accent);
      color: #0a0a0a; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
      cursor: pointer; transition: transform 0.35s var(--exp), box-shadow 0.35s var(--exp), background 0.3s ease;
    }
    .cta:hover { background: #FFCC00; transform: translateY(-2px); box-shadow: 0 16px 48px rgba(255,221,0,0.24); }
    .foot p { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }

    @media (prefers-reduced-motion: reduce) {
      .proc::after { animation: none; }
    }
  </style>
</helmet>

<div class="bp cons cons--n{{i}}">
  <div class="wrap">

    <p class="label">CONSULTORÍA</p>
    <h2 class="title">Implementación personalizada para tu estudio</h2>
    <p class="lede">Tres fases, una sesión individual. Elegí una fase para verla en detalle.</p>

    <div class="proc"></div>

    <div class="fases">
      <button class="fase" data-i="0" onClick="{{ p0 }}">
        <span class="fase__cap"></span>
        <span class="fase__n">Fase 01</span>
        <span class="fase__ico">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          </svg>
        </span>
        <h3>Análisis</h3>
        <span class="fase__under"></span>
        <p>Evaluación profunda de tu flujo de trabajo actual e identificación de oportunidades de optimización con IA.</p>
      </button>

      <button class="fase" data-i="1" onClick="{{ p1 }}">
        <span class="fase__cap"></span>
        <span class="fase__n">Fase 02</span>
        <span class="fase__ico">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M3 9h18M9 21V9"></path>
          </svg>
        </span>
        <h3>Estrategia</h3>
        <span class="fase__under"></span>
        <p>Diseño de un plan personalizado de implementación adaptado a las necesidades específicas de tu estudio.</p>
      </button>

      <button class="fase" data-i="2" onClick="{{ p2 }}">
        <span class="fase__cap"></span>
        <span class="fase__n">Fase 03</span>
        <span class="fase__ico">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </span>
        <h3>Acompañamiento</h3>
        <span class="fase__under"></span>
        <p>Soporte continuo durante todo el proceso de adopción para garantizar el éxito de la implementación.</p>
      </button>
    </div>

    <div class="foot">
      <button class="cta">
        Agendar consultoría
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
      <p>Sesión individual · Previo pago · Cupos limitados</p>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const pick = (n) => () => this.setState({ i: n });
    return { i: this.state.i, p0: pick(0), p1: pick(1), p2: pick(2) };
  }
}
</script>
</body>
</html>
