<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #000000; }
    a { color: #FFDD00; text-decoration: none; }
    a:hover { color: #FFCC00; }
    .hero {
      --accent: #FFDD00;
      --ink: #f0f0f0;
      --dim: rgba(255,255,255,0.62);
      --faint: rgba(255,255,255,0.34);
      --rule: rgba(255,255,255,0.13);
      --exp: cubic-bezier(0.16, 1, 0.3, 1);
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      position: relative; width: 100%; height: 900px; overflow: hidden;
      background: #000000; color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif; line-height: 1.6;
      display: flex; align-items: center;
    }
    .scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .stage { position: relative; z-index: 3; width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 48px; }
    .badge {
      display: inline-flex; align-items: center; gap: 11px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.72); margin-bottom: 30px;
    }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.35; transform:scale(.7);} }
    h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
    h1 em { font-style: normal; color: var(--accent); }
    .tag { color: var(--dim); }
    .sub { color: var(--ink); }
    .ctas { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .b1 {
      display: inline-flex; align-items: center; gap: 11px; padding: 19px 44px; border-radius: 50px;
      background: var(--accent); border: 2px solid var(--accent); color: #0a0a0a;
      font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; cursor: pointer;
      transition: transform .35s var(--exp), box-shadow .35s var(--exp), background .3s ease;
    }
    .b1:hover { background: #FFCC00; color: #0a0a0a; transform: translateY(-2px); box-shadow: 0 16px 48px rgba(255,221,0,.26); }
    .b2 {
      display: inline-flex; align-items: center; gap: 11px; padding: 19px 38px; border-radius: 50px;
      background: none; border: 1px solid var(--rule); color: var(--ink);
      font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
      transition: border-color .35s var(--exp), color .35s var(--exp), transform .35s var(--exp);
    }
    .b2:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    .mnum { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); display: block; }
    .mlab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--faint); }
    .arrow { color: var(--accent); }
    .scroll { position: absolute; z-index: 3; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; color: var(--faint); }
    .scroll i { display: block; width: 54px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); animation: sweep 2.6s var(--exp) infinite; }
    @keyframes sweep { 0% { transform: scaleX(.2); transform-origin: left; opacity:.4 } 50% { transform: scaleX(1); opacity:1 } 100% { transform: scaleX(.2); transform-origin: left; opacity:.4 } }


    /* ── Mashrabiya paramétrico: 240 rombos que abren y cierran de verdad.
         El retardo es función de (columna + fila) → la onda viaja en diagonal. ── */
    .mash {
      position: absolute; inset: -3%; z-index: 1;
      display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(12, 1fr);
      gap: 4px;
    }
    .mash span { position: relative; display: grid; place-items: center; }
    .mash span::before {
      content: ''; display: block; width: 74%; height: 74%;
      border: 1px solid rgba(255, 221, 0, 0.85);
      transform: rotate(45deg) scale(0.14);
      animation: aperture 5.4s ease-in-out infinite;
      animation-delay: calc(var(--d) * -0.155s);
    }
    /* Un tercio de las celdas lleva un núcleo sólido: da densidad y profundidad */
    .mash span.solid::after {
      content: ''; position: absolute; width: 26%; height: 26%;
      background: rgba(255, 255, 255, 0.9);
      transform: rotate(45deg) scale(0.2);
      animation: core 5.4s ease-in-out infinite;
      animation-delay: calc(var(--d) * -0.155s);
    }
    @keyframes aperture {
      0%, 100% { transform: rotate(45deg) scale(0.14); opacity: 0.16; }
      50%      { transform: rotate(45deg) scale(1);    opacity: 0.68; }
    }
    @keyframes core {
      0%, 100% { transform: rotate(45deg) scale(0.15); opacity: 0.1; }
      50%      { transform: rotate(45deg) scale(1);    opacity: 0.55; }
    }
    .scrim {
      background:
        linear-gradient(95deg, rgba(0,0,0,0.97) 28%, rgba(0,0,0,0.76) 54%, rgba(0,0,0,0.28) 80%),
        linear-gradient(180deg, rgba(0,0,0,0.78), transparent 24%, transparent 66%, rgba(0,0,0,0.96));
    }
    .stage { display: grid; grid-template-columns: minmax(0, 1.05fr) 0.7fr; gap: 80px; align-items: end; }
    .stage h1 { font-size: 82px; line-height: 1.0; margin: 0 0 30px; max-width: 15ch; }
    .rule { display: block; width: 96px; height: 3px; background: var(--accent); margin: 0 0 30px; }
    .tag { font-size: 17px; margin: 0 0 6px; }
    .sub { font-size: 21px; font-weight: 500; margin: 0 0 40px; }
    .strip { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; border-top: 1px solid var(--rule); }
    .strip__in { max-width: 1400px; margin: 0 auto; padding: 26px 48px; display: grid; grid-template-columns: auto auto 1fr auto; gap: 40px; align-items: center; }
    .strip__m { display: flex; align-items: baseline; gap: 14px; }
    .strip__m + .strip__m { border-left: 1px solid var(--rule); padding-left: 40px; }
    .mnum { font-size: 26px; }
    .scroll { position: static; justify-self: end; }
    @media (prefers-reduced-motion: reduce) {
      .mash span::before, .mash span.solid::after, .scroll i, .badge i { animation: none; }
      .mash span::before { transform: rotate(45deg) scale(0.6); opacity: .35; }
    }
  </style>
</helmet>
